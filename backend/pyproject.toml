[project]
name = "forum24-api"
version = "0.1.0"
description = "FORUM24 API — news, Learning Centre and editorial backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "aiosqlite>=0.20",
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
